  <!-- BOTTOM DOUBLE LINE -->
  <line x1="0" y1="188" x2="1000" y2="188" stroke="#111827" stroke-width="2.5"/>
  <line x1="0" y1="192" x2="1000" y2="192" stroke="#111827" stroke-width="1"/>
