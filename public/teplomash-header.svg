<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 195" width="1000" height="195">
  <rect width="1000" height="195" fill="#ffffff"/>
  
  <!-- LOGO GROUP -->
  <g transform="translate(8, 6)">
    <!-- LEFT ARROW -->
    <!-- Top upward chevron (outlined) -->
    <path d="M 14,14 L 28,38 L 22,38 L 14,24 L 6,38 L 0,38 Z" fill="#111827"/>
    <polygon points="14,19 23,35 19,35 14,26 9,35 5,35" fill="#ffffff"/>
    <!-- Stem and bottom arrow (filled) -->
    <path d="M 10,38 L 18,38 L 18,72 L 28,72 L 14,94 L 0,72 L 10,72 Z" fill="#111827"/>

    <!-- CENTER ARROW (taller top and bottom) -->
    <!-- Top upward chevron (outlined) -->
    <path d="M 42,0 L 56,24 L 50,24 L 42,10 L 34,24 L 28,24 Z" fill="#111827"/>
    <polygon points="42,5 51,21 47,21 42,12 37,21 33,21" fill="#ffffff"/>
    <!-- Stem and bottom arrow (filled) -->
    <path d="M 38,24 L 46,24 L 46,86 L 56,86 L 42,108 L 28,86 L 38,86 Z" fill="#111827"/>

    <!-- RIGHT ARROW -->
    <!-- Top upward chevron (outlined) -->
    <path d="M 70,14 L 84,38 L 78,38 L 70,24 L 62,38 L 56,38 Z" fill="#111827"/>
    <polygon points="70,19 79,35 75,35 70,26 65,35 61,35" fill="#ffffff"/>
    <!-- Stem and bottom arrow (filled) -->
    <path d="M 66,38 L 74,38 L 74,72 L 84,72 L 70,94 L 56,72 L 66,72 Z" fill="#111827"/>

    <!-- "Тепломаш" WORDMARK -->
    <!-- Large corporate logotype positioned cleanly with no overlap -->
    <g transform="translate(108, 0)">
      <text x="0" y="80" font-family="'Arial Black', 'Trebuchet MS', 'Arial', sans-serif" font-weight="900" font-size="82" fill="#111827" letter-spacing="-1.5">Тепломаш</text>
      <!-- Registered Trademark Symbol ® -->
      <g transform="translate(460, 26)">
        <circle cx="8" cy="8" r="7.5" fill="none" stroke="#111827" stroke-width="1.2"/>
        <text x="8" y="11.5" font-family="Arial, sans-serif" font-weight="bold" font-size="10.5" fill="#111827" text-anchor="middle">R</text>
      </g>
    </g>
  </g>

  <!-- LEFT COLUMN: Requisites -->
  <g transform="translate(8, 114)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="bold" font-size="12.5" fill="#111827">Акционерное общество</text>
    <text x="0" y="15" font-family="Arial, sans-serif" font-weight="bold" font-size="12.5" fill="#111827">«Научно-производственное объединение «Тепломаш»</text>
    <text x="0" y="29" font-family="Arial, sans-serif" font-size="12" fill="#111827">АО «НПО «Тепломаш»</text>
    <text x="0" y="43" font-family="Arial, sans-serif" font-size="12" fill="#111827">ИНН 7806112986, КПП 780601001, ОГРН 1027809212573</text>
    <text x="0" y="57" font-family="Arial, sans-serif" font-size="12" fill="#111827">р/с 40702810055130177203</text>
    <text x="0" y="71" font-family="Arial, sans-serif" font-size="12" fill="#111827">Северо-Западный Банк ПАО «Сбербанк» г. Санкт-Петербург</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#111827">к/с 30101810500000000653  БИК 044030653</text>
  </g>

  <!-- RIGHT COLUMN: Contacts (Right Aligned) -->
  <g transform="translate(992, 40)" text-anchor="end">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" fill="#111827">Адрес: 195279, Санкт-Петербург,</text>
    <text x="0" y="16" font-family="Arial, sans-serif" font-size="13" fill="#111827">шоссе Революции, д.90, л.А</text>
    <text x="0" y="34" font-family="Arial, sans-serif" font-size="13" fill="#111827">тел. +7 (812) <tspan font-weight="bold" font-style="italic">301-99-40</tspan></text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="13" fill="#111827">тел./факс +7 (812) <tspan font-weight="bold" font-style="italic">327-63-82</tspan></text>
    
    <text x="0" y="86" font-family="Arial, sans-serif" font-style="italic" font-size="13" fill="#111827">root@teplomash.ru</text>
    <text x="0" y="102" font-family="Arial, sans-serif" font-style="italic" font-size="13" fill="#111827">www.teplomash.ru</text>
